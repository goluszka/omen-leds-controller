[metadata]
name = omen-led
version = 0.1.0
description = Software control of the HP OMEN 27k monitor's external lighting on macOS
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
keywords = omen, hp, rgb, led, hid, monitor, lighting
classifiers =
    Environment :: MacOS X
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: MacOS :: MacOS X
    Programming Language :: Python :: 3
    Topic :: System :: Hardware

[options]
packages = omenled
python_requires = >=3.9
install_requires =
    hidapi>=0.14

[options.package_data]
omenled = py.typed

[options.entry_points]
console_scripts =
    omen-led = omenled.cli:main
