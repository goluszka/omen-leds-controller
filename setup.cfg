[metadata]
name = omen-led
version = attr: omenled.__version__
description = Control the RGB LED lighting of the HP OMEN 27k monitor from macOS: Python CLI and library for its reverse-engineered USB HID protocol
long_description = file: README.md
long_description_content_type = text/markdown
author = Krzysztof Gołuszka
url = https://github.com/goluszka/omen-leds-controller
project_urls =
    Source = https://github.com/goluszka/omen-leds-controller
    Issues = https://github.com/goluszka/omen-leds-controller/issues
    Protocol notes = https://github.com/goluszka/omen-leds-controller/blob/main/docs/protocol.md
license = MIT
license_files = LICENSE
keywords =
    hp omen
    omen 27k
    monitor lighting
    rgb
    led
    ambient light
    usb hid
    hidapi
    macos
    reverse engineering
classifiers =
    Development Status :: 4 - Beta
    Environment :: Console
    Environment :: MacOS X
    Intended Audience :: Developers
    Intended Audience :: End Users/Desktop
    License :: OSI Approved :: MIT License
    Operating System :: MacOS :: MacOS X
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.9
    Topic :: System :: Hardware
    Topic :: System :: Hardware :: Hardware Drivers

[options]
packages = omenled
python_requires = >=3.9
install_requires =
    hidapi>=0.14

[options.package_data]
omenled = py.typed

[options.entry_points]
console_scripts =
    omen-led = omenled.cli:main
